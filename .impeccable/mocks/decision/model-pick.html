<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rail map sketch</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; background: #fff; font-family: "Segoe UI", Arial, sans-serif; color: #1b1b1f; position: relative; }
  .sign { position: absolute; left: 80px; top: 60px; background: #1b1b1f; color: #fff; padding: 22px 34px; border-radius: 10px; }
  .sign b { font-size: 56px; font-weight: 800; display: block; }
  .sign span { font-size: 24px; opacity: 0.85; }
  .gate { position: absolute; right: 80px; top: 72px; display: flex; gap: 14px; }
  .gate div { height: 60px; padding: 0 28px; display: grid; place-items: center; font-size: 24px; font-weight: 700; border-radius: 30px; border: 3px solid #1b1b1f; }
  .gate div:first-child { background: #1b1b1f; color: #fff; }
  svg { position: absolute; left: 0; top: 230px; }
  .station { font-size: 26px; font-weight: 800; }
</style>
</head>
<body>
  <div class="sign"><b>Muhammad Alif Hakimi</b><span>Full-stack and AI developer · Diploma in CS, UNITEN</span></div>
  <div class="gate"><div>Email</div><div>CV</div></div>
  <svg width="1440" height="670" viewBox="0 0 1440 670">
    <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 180 H420 L560 320 H1380" stroke="#d4213d"/>
      <path d="M60 460 H380 L560 320 L720 160 H1380" stroke="#0a8a4a"/>
      <path d="M60 560 H900 L1060 400 H1380" stroke="#f2b705"/>
      <path d="M60 320 H560 L900 560 V560" stroke="#1f5fbf"/>
      <path d="M720 60 V160 L1060 400 V620" stroke="#8b3fbf"/>
    </g>
    <g fill="#fff" stroke="#1b1b1f" stroke-width="6">
      <circle cx="560" cy="320" r="30"/><circle cx="1060" cy="400" r="30"/><circle cx="720" cy="160" r="30"/>
    </g>
    <text x="600" y="380" class="station">Specify</text>
    <text x="1100" y="460" class="station">Study Hub</text>
    <text x="760" y="130" class="station">RWBY Afterlight</text>
    <g font-size="20" font-weight="700"><text x="60" y="160">TypeScript</text><text x="60" y="440">Python</text><text x="60" y="540">SQL</text><text x="60" y="300">React</text></g>
  </svg>
</body>
</html>
